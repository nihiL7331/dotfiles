add_newline = false
format = "$directory$git_branch$git_status$character"

[directory]
style = "bright white"
truncation_length = 3
truncate_to_repo = true

[character]
success_symbol = "[\\$](bright white)"
error_symbol = "[\\$](bold red)"

[git_branch]
format = "[$branch]($style) "
style = "bold white"

[git_status]
format = "[\\[$all_status$ahead_behind\\]]($style) "
style = "bold red"
